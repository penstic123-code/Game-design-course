<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Flashcards</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  #stage{perspective:900px;margin:14px auto;max-width:520px}
  #card{position:relative;height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
  #card.flip{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border:4px solid var(--ink);border-radius:18px 40px 18px 36px;box-shadow:6px 7px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}
  .front{background:var(--yellow)}
  .back{background:#fff;transform:rotateY(180deg)}
  .front h2{margin:0;font-size:2.2rem}
  .back p{font-size:1.1rem;margin:4px 0}
  .rate{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .box{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
  .box .stat b{font-size:1.2rem}
</style>
</head>
<body data-ch="0">
<main class="wrap">
  <div class="hero"><div class="txt"><span class="badge">Spaced repetition</span><h1>Review Flashcards</h1><p class="sub">Recall first, then flip. Cards you get right come back after longer and longer gaps (the Leitner box method).</p></div></div>
  <div class="box" id="box"></div>
  <div id="stage"><div id="card"><div class="face front"><h2 id="ft"></h2><p class="small">Answer in your head first, then click the card to flip it</p></div><div class="face back"><p id="bd"></p><p class="small" id="bc"></p></div></div></div>
  <div class="rate" id="rate" style="display:none">
    <button class="btn pink" data-r="0">😵 Forgot</button><button class="btn" data-r="1">🤔 Fuzzy</button><button class="btn green" data-r="2">😎 Got it</button>
  </div>
  <div class="msg" id="msg" style="text-align:center"></div>
  <div style="text-align:center"><a href="glossary.html"><span class="btn alt">📖 Glossary</span></a> <a href="index.html"><span class="btn">Contents</span></a> <button class="btn pink" id="reset">Reset progress</button></div>
</main>
<script src="../js/common.js"></script>
<script src="../js/glossary-data.js"></script>
<script>
const T = (window.GLOSSARY || []).filter(e => e.te).map(e => ({ ...e, t: e.t, te: e.te, d: e.de })), KEY = "gdc-cards";
let st = {}; try { st = JSON.parse(GD.store.get(KEY) || "{}"); } catch (e) {}
const INTERVAL = [0, 1, 3, 7];                    // 各盒子的复习间隔（天）；盒 0 = 新卡/错题，当次反复
const DAY = 864e5, now = () => Date.now();
const save = () => GD.store.set(KEY, JSON.stringify(st));
function due() { return T.filter(e => { const s = st[e.t]; return !s || s.due <= now(); }); }
let cur = null;
function pick() {
  const d = due();
  document.getElementById("box").innerHTML = [0, 1, 2, 3].map(b => `<span class="stat">Box ${b} <b>${T.filter(e => (st[e.t] ? st[e.t].b : 0) === b).length}</b></span>`).join("") + `<span class="stat">Due today <b>${d.length}</b></span>`;
  if (!d.length) { cur = null; document.getElementById("ft").textContent = "🎉 Nothing to review today"; document.getElementById("card").classList.remove("flip"); document.getElementById("rate").style.display = "none"; return; }
  // 优先错题（低盒子），其次随机
  d.sort((a, b) => ((st[a.t] ? st[a.t].b : 0) - (st[b.t] ? st[b.t].b : 0)) || Math.random() - .5);
  cur = d[0]; document.getElementById("card").classList.remove("flip"); document.getElementById("rate").style.display = "none";
  document.getElementById("ft").textContent = cur.te; document.getElementById("bd").textContent = cur.d;
  document.getElementById("bc").innerHTML = "From " + cur.chs.map(c => `<a href="${GD.CH[c - 1][1]}">Ch. ${c}</a>`).join(", ");
}
document.getElementById("card").onclick = () => { if (!cur) return; document.getElementById("card").classList.add("flip"); document.getElementById("rate").style.display = "flex"; };
document.querySelectorAll("#rate button").forEach(b => (b.onclick = () => {
  const r = +b.dataset.r, s = st[cur.t] || { b: 0 };
  s.b = r === 2 ? Math.min(3, s.b + 1) : r === 1 ? s.b : 0;
  s.due = now() + (r === 0 ? 0.01 : INTERVAL[s.b] * DAY || 0.02 * DAY);
  st[cur.t] = s; save();
  document.getElementById("msg").textContent = r === 2 ? "✔ Up to box " + s.b + ", next in about " + (INTERVAL[s.b] || 0) + " days" : r === 1 ? "A bit more practice" : "No worries, you’ll see it again right away";
  pick();
}));
document.getElementById("reset").onclick = () => { if (confirm("Clear flashcard progress?")) { st = {}; save(); pick(); } };
pick();
</script>
</body>
</html>
