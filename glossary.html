<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>术语表</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}
  .tc{background:#fff;border:3px solid var(--ink);border-radius:12px 22px 12px 20px;padding:8px 14px;box-shadow:3px 4px 0 var(--ink)}
  .tc h3{margin:0;font-size:1.25rem}
  .tc p{margin:2px 0 4px;font-size:.95rem;line-height:1.6}
  .tc a{font-size:.85rem;margin-right:6px;border:2px solid var(--ink);border-radius:10px;padding:0 6px;text-decoration:none;background:var(--c,#ffe58a)}
  input.search{max-width:320px}
</style>
</head>
<body data-ch="0">
<main class="wrap">
  <div class="hero"><div class="txt"><span class="badge">速查</span><h1>术语表</h1><p class="sub" id="sub"></p></div></div>
  <div class="board">
    <input type="text" class="search" id="q" placeholder="🔍 搜索术语或解释">
    <div class="pchips" id="chips" style="margin-top:8px"></div>
    <a href="flashcards.html"><span class="btn green">🃏 用闪卡复习</span></a>
    <a href="index.html"><span class="btn alt">📖 回目录</span></a>
  </div>
  <div class="terms" id="list"></div>
</main>
<script src="js/common.js"></script>
<script src="js/glossary-data.js"></script>
<script>
const T = window.GLOSSARY || [], P = GD.PARTS;
let part = -1, q = "";
document.getElementById("sub").textContent = "全课共 " + T.length + " 个术语。点章节标签可跳到出处；文中带虚线下划线的词悬停也能看释义。";
const chips = document.getElementById("chips");
["全部", ...P.map(p => p.zh)].forEach((n, i) => {
  const b = document.createElement("button"); b.className = "chip" + (i === 0 ? " on" : ""); b.textContent = n;
  if (i) b.style.background = P[i - 1].accent;
  b.onclick = () => { part = i - 1; [...chips.children].forEach((c, k) => c.classList.toggle("on", k === i)); draw(); };
  chips.appendChild(b);
});
document.getElementById("q").oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
function draw() {
  const L = T.filter(e => (part < 0 || GD.partOf(e.ch) === part) && (!q || e.t.toLowerCase().includes(q) || e.d.toLowerCase().includes(q)));
  document.getElementById("list").innerHTML = L.map(e => `<div class="tc"><h3>${e.t}</h3><p>${e.d}</p>${e.chs.map(c => `<a href="${GD.CH[c - 1][1]}" style="--c:${P[GD.partOf(c)].accent}">第${c}章</a>`).join("")}</div>`).join("") || "<p>没有匹配的术语。</p>";
}
draw();
</script>
</body>
</html>
